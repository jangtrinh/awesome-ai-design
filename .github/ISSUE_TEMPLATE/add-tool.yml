name: Add a tool
description: Suggest a tool, MCP server or agent skill for Awesome AI Design. A bot turns this form into a draft pull request.
title: "Add: <tool name>"
labels: [candidate]
body:
  - type: markdown
    attributes:
      value: |
        Read [contributing.md](https://github.com/jangtrinh/awesome-ai-design/blob/main/contributing.md) first. One tool per issue.
        After you submit, a bot checks the form, looks for duplicates and opens a draft pull request. Edit this issue to fix anything it reports; the bot runs again.
        Plain text only: no links or markdown in the name or description.
  - type: input
    id: name
    attributes: {label: Name}
    validations: {required: true}
  - type: input
    id: url
    attributes: {label: "URL (repo or product page)"}
    validations: {required: true}
  - type: dropdown
    id: job
    attributes:
      label: Job it does
      options: [generate-ui, design-with-agents, connect-agents-to-design-files, teach-agents-taste, stay-on-system, design-to-code, make-3d, make-vectors-and-motion, check-what-agents-built]
    validations: {required: true}
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [app, mcp-server, agent-skill, library, plugin, cli, model, spec, other]
    validations: {required: true}
  - type: dropdown
    id: runs
    attributes:
      label: Where it runs
      options: [cloud, local, cloud or local, in design app, n/a]
    validations: {required: true}
  - type: dropdown
    id: price
    attributes: {label: Price model, options: [free, freemium, paid, paid-for-full-access, free-for-individuals]}
    validations: {required: true}
  - type: input
    id: licence
    attributes: {label: "Licence (SPDX id, or licence name if source-available or proprietary)"}
    validations: {required: true}
  - type: dropdown
    id: mcp
    attributes: {label: "Is it or does it ship an MCP server?", options: ["yes", "no", "not sure"]}
  - type: textarea
    id: description
    attributes: {label: "One factual sentence on what it does (max 220 characters, no marketing words)"}
    validations: {required: true}
  - type: dropdown
    id: affiliation
    attributes: {label: "Are you affiliated with this project?", options: ["no", "yes, I made it or work on it", "yes, I am paid by it"]}
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: It helps AI do real design work (interface, visual, 3D, motion or UX), not a generic image generator or prompt pack
          required: true
        - label: The link is the project's own page or repo, with no affiliate, referral or tracking parameters
          required: true
